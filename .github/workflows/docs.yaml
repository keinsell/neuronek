name: Documentation

on:
  push:
    branches:
      - next
      - trunk
      - ci/cargo/add-documentation-page
  pull_request:
    branches:
      - next
      - trunk

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate Docs
        run: cargo doc --no-deps --document-private-items --all-features
      - name: Fetch Latest Release
        id: release
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName --limit 1)
          ASSETS=$(gh release view $LATEST_TAG --json assets -q '.assets[] | .name + ":" + .browser_download_url')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "assets<<EOF" >> $GITHUB_OUTPUT
          echo "$ASSETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate Index HTML
        run: |
          ASSETS="${{ steps.release.outputs.assets }}"
          DOWNLOAD_LINKS=""
          while IFS=: read -r NAME URL; do
            DOWNLOAD_LINKS+="<a href='$URL' class='doc-link'><strong>$NAME</strong>Download latest release artifact</a>"
          done <<< "$ASSETS"
          cat > target/doc/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <!-- Your existing HTML head and styles -->
          <body>
              <div class="header">
                  <h1>🧬 Neuronek Documentation</h1>
                  <p>Intelligent dosage tracker application for monitoring supplements, nootropics and psychoactive substances</p>
              </div>
              <div class="doc-section">
                  <h2>📚 API Documentation</h2>
                  <p>Complete Rust API documentation generated from source code comments.</p>
                  <div class="doc-links">
                      <a href="./neuronek/index.html" class="doc-link">
                          <strong>Neuronek Crate</strong>
                          Main application documentation including all modules, structs, and functions
                      </a>
                  </div>
              </div>
              <div class="doc-section">
                  <h2>⬇️ Downloads & Installation</h2>
                  <p>Latest release: ${{ steps.release.outputs.tag }}</p>
                  <p>Install via Cargo: <code>cargo install neuronek</code></p>
                  <div class="doc-links">
                      $DOWNLOAD_LINKS
                  </div>
              </div>
              <div class="footer">
                  <p>Generated automatically from source code • <a href="https://github.com/keinsell/neuronek">View on GitHub</a></p>
              </div>
          </body>
          </html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
  deploy:
    environment:
      name: documentation
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4