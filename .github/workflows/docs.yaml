name: Documentation

on:
  push:
    branches:
      - next
      - trunk
      - ci/cargo/add-documentation-page
  pull_request:
    branches:
      - next
      - trunk

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-unknown-linux-gnu
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
            ${{ runner.os }}-cargo-

      - name: Generate Rust documentation
        run: |
          cargo doc --no-deps --document-private-items --all-features
          
      - name: Create documentation index
        run: |
            cat > target/doc/index.html << 'EOF'
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Neuronek</title>
                <style>
                    body {
                        font-family: 'Courier New', Courier, monospace;
                        max-width: 800px;
                        margin: 0 auto;
                        padding: 2rem;
                        background-color: #fff;
                        color: #000;
                        line-height: 1.5;
                    }
                    .header {
                        text-align: center;
                        margin-bottom: 2rem;
                        border-bottom: 1px solid #ddd;
                        padding-bottom: 1rem;
                    }
                    .header h1 {
                        margin-bottom: 0.5rem;
                    }
                    .header p {
                        font-size: 1rem;
                    }
                    .section {
                        margin-bottom: 2rem;
                    }
                    .section h2 {
                        border-bottom: 1px solid #ddd;
                        padding-bottom: 0.5rem;
                        margin-top: 0;
                    }
                    pre {
                        background: #f8f8f8;
                        padding: 1rem;
                        border: 1px solid #ddd;
                        overflow: auto;
                    }
                    a {
                        color: #000;
                        text-decoration: underline;
                    }
                    .footer {
                        text-align: center;
                        margin-top: 2rem;
                        border-top: 1px solid #ddd;
                        padding-top: 1rem;
                        font-size: 0.9rem;
                    }
                </style>
            </head>
            <body>
                <div class="header">
                    <h1>🧬 Neuronek</h1>
                    <p>CLI tool for tracking dosages of supplements, nootropics, and psychoactive substances intelligently.</p>
                </div>
                
                <div class="section">
                    <h2>Installation</h2>
                    <p>Install via Cargo:</p>
                    <pre><code>cargo install neuronek</code></pre>
                </div>
                
                <div class="section">
                    <h2>Documentation</h2>
                    <p>View API docs:</p>
                    <a href="./neuronek/index.html">Neuronek Crate</a>
                </div>
                
                <div class="footer">
                    <p><a href="https://github.com/keinsell/neuronek">GitHub</a></p>
                </div>
            </body>
            </html>
            EOF

      - name: Setup Pages
        if: github.ref == 'refs/heads/ci/cargo/add-documentation-page'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/ci/cargo/add-documentation-page'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    if: github.ref == 'refs/heads/ci/cargo/add-documentation-page'
    environment:
      name: documentation
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
